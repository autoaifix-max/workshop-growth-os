openapi: 3.1.0
info:
  title: Workshop Growth OS API
  version: 1.0.0-draft
  description: >-
    Contract for implemented v1 routes only. Non-health routes require a valid
    Supabase SSR authenticated session. The project-specific cookie name is
    intentionally not fixed in this draft. Bookings and work orders are planned
    but are not implemented yet.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Customers
  - name: Vehicles
paths:
  /health:
    get:
      tags: [Health]
      summary: Process liveness check; does not verify database connectivity
      responses:
        "200":
          description: Application process is responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /customers:
    get:
      tags: [Customers]
      summary: List customers for the authenticated active workshop
      x-authentication: Supabase SSR session
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Customer list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Account has multiple active workshop memberships
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Customers]
      summary: Create a customer in the authenticated active workshop
      x-authentication: Supabase SSR session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Customer created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Phone already exists in this workshop
        "500":
          $ref: "#/components/responses/ServerError"
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles for the authenticated active workshop
      x-authentication: Supabase SSR session
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Vehicle list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Account has multiple active workshop memberships
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [Vehicles]
      summary: Register a vehicle linked to a customer in the same workshop
      x-authentication: Supabase SSR session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleInput"
      responses:
        "201":
          description: Vehicle registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Customer does not belong to this workshop or was not found
        "409":
          description: Plate number or VIN already exists in this workshop
        "500":
          $ref: "#/components/responses/ServerError"
components:
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  schemas:
    SuccessEnvelope:
      type: object
      required: [ok, data, error]
      properties:
        ok:
          const: true
        data: {}
        error:
          type: "null"
    ErrorEnvelope:
      type: object
      required: [ok, data, error]
      properties:
        ok:
          const: false
        data:
          type: "null"
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    CustomerInput:
      type: object
      additionalProperties: false
      required: [fullName, phone]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 8
          maxLength: 20
          pattern: '^[+0-9()\-\s]+$'
        notes:
          type: string
          maxLength: 2000
    VehicleInput:
      type: object
      additionalProperties: false
      required: [customerId, plateNumber, make, model]
      properties:
        customerId:
          type: string
          format: uuid
        plateNumber:
          type: string
          minLength: 2
          maxLength: 20
        make:
          type: string
          minLength: 1
          maxLength: 60
        model:
          type: string
          minLength: 1
          maxLength: 60
        modelYear:
          type: integer
          minimum: 1950
          maximum: 2100
        vin:
          type: string
          minLength: 5
          maxLength: 40
  responses:
    ValidationError:
      description: Invalid request body or query parameter
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Active workshop membership required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Unexpected server-side error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
